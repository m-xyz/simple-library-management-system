<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Library — Log History</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background: #ffffff;
            color: #000000;

            font-family: "Courier New", monospace;
            font-size: 14px;

            background-image:
                radial-gradient(#000 0.6px, transparent 0.6px);

            background-size: 4px 4px;
        }

        .window {
            width: 94%;
            max-width: 1400px;

            margin: 35px auto;

            background: #ffffff;

            border: 3px solid #000;

            box-shadow:
                6px 6px 0 #000;
        }

        .window-icon {
            width: 16px;
            height: 16px;

            border: 2px solid #000;

            margin-right: 10px;

            background:
                linear-gradient(to bottom,
                    #000 0px,
                    #000 2px,
                    #fff 2px,
                    #fff 4px);

            background-size: 100% 4px;
        }

        .title-bar {
            height: 34px;

            display: flex;
            align-items: center;

            border-bottom: 3px solid #000;

            background: #fff;

            padding: 0 8px;

            position: relative;
        }

        .close-button {
            width: 18px;
            height: 18px;

            padding: 0;

            background: #fff;
            color: #000;

            border: 2px solid #000;

            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;

            line-height: 12px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;
        }

        .close-button:hover {
            background: #000;
            color: #fff;
        }

        .title {
            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            background: #fff;

            padding: 0 12px;

            font-weight: bold;

            letter-spacing: 1px;
        }

        .content {
            padding: 25px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 22px;

            margin: 0 0 8px 0;

            text-transform: uppercase;
        }

        .page-header h1 span {
            background: #000;

            color: #fff;

            padding: 2px 6px;
        }

        .page-description {
            font-size: 13px;

            margin-top: 12px;

            line-height: 1.5;
        }

        .toolbar {
            display: flex;

            gap: 12px;

            margin-bottom: 28px;
        }

        .mac-button {
            display: inline-block;

            min-width: 150px;

            padding: 8px 14px;

            color: #000;

            background: #fff;

            border: 1px solid #000;

            text-decoration: none;

            font-family: "Courier New", monospace;

            font-weight: bold;

            text-align: center;

            box-shadow:
                3px 3px 0 #000;
        }

        .mac-button:hover {
            background: #000;

            color: #fff;
        }

        .mac-button:active {
            transform: translate(2px, 2px);

            box-shadow:
                1px 1px 0 #000;
        }

        .section-title {
            font-weight: bold;

            margin-bottom: 8px;

            padding: 5px 8px;

            border: 2px solid #000;

            background: #000;

            color: #fff;

            letter-spacing: 1px;
        }

        .table-wrapper {
            border: 2px solid #000;

            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            background: #fff;

            min-width: 950px;
        }

        th {
            background: #fff;

            border-bottom: 3px double #000;

            padding: 10px;

            text-align: left;

            font-weight: bold;

            text-transform: uppercase;

            white-space: nowrap;
        }

        td {
            padding: 10px;

            border-bottom: 1px solid #000;

            white-space: nowrap;
        }

        tbody tr:nth-child(even) {
            background: repeating-linear-gradient(45deg,
                    #fff,
                    #fff 2px,
                    #000 2px,
                    #000 3px);

            background-size: 5px 5px;
        }

        tbody tr:nth-child(even) td {
            background: rgba(255, 255, 255, 0.88);
        }

        tbody tr:hover td {
            background: #000;

            color: #fff;
        }

        .action {
            font-weight: bold;

            text-align: center;

            width: 130px;
        }

        .action-label {
            display: inline-block;

            padding: 4px 7px;

            border: 2px solid #000;

            background: #fff;

            color: #000;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 0.5px;
        }

        tbody tr:hover .action-label {
            background: #000;

            color: #fff;

            border-color: #fff;
        }

        .isbn {
            font-family: "Courier New", monospace;

            font-weight: bold;
        }

        .fine {
            text-align: center;

            white-space: nowrap;
        }

        .no-fine {
            color: #555;
        }

        .has-fine {
            color: rgb(255, 0, 0);

            font-weight: bold;
        }

        tbody tr:hover .has-fine {
            color: #fff;
        }

        .log-count {
            margin-top: 12px;

            font-size: 12px;

            font-weight: bold;
        }

        .status-bar {
            display: flex;

            justify-content: space-between;

            margin-top: 25px;

            border-top: 3px double #000;

            padding-top: 8px;

            font-size: 12px;
        }

        .status-indicator {
            display: inline-block;

            width: 10px;
            height: 10px;

            border: 2px solid #000;

            margin-right: 5px;

            vertical-align: middle;
        }

        .resize-handle {
            width: 15px;
            height: 15px;

            border-left: 2px solid #000;

            border-top: 2px solid #000;

            margin-left: auto;
        }

        .loan-status {
            background: #dcecff;
            color: #003399;
            border-color: #003399;
        }

        .loan-done-status {
            background: #dcf5dc;
            color: #006600;
            border-color: #006600;
        }

        tbody tr:hover .loan-status,
        tbody tr:hover .loan-done-status {
            background: #000;
            color: #fff;
            border-color: #fff;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .content {
                padding: 15px;
            }

            .toolbar {
                flex-direction: column;
            }

            .mac-button {
                width: 100%;
            }

            .window {
                width: 96%;

                margin: 15px auto;
            }

            .page-header h1 {
                font-size: 18px;
            }
        }
    </style>

</head>

<body>

    <div class="window">

        <!-- ============================================= -->
        <!-- MACINTOSH TITLE BAR                           -->
        <!-- ============================================= -->

        <div class="title-bar">

            <div class="window-icon"></div>

            <div class="title">
                LIBRARY LOG
            </div>

        </div>

        <!-- ============================================= -->
        <!-- CONTENT                                       -->
        <!-- ============================================= -->

        <div class="content">

            <!-- ========================================= -->
            <!-- PAGE HEADER                               -->
            <!-- ========================================= -->

            <div class="page-header">

                <h1>
                    <span>LOAN HISTORY</span>
                </h1>

            </div>

            <!-- ========================================= -->
            <!-- ACTIONS                                   -->
            <!-- ========================================= -->

            <div class="toolbar">

                <a href="/owner" class="mac-button">
                    < BACK </a>

            </div>

            <!-- ========================================= -->
            <!-- LOG HISTORY                               -->
            <!-- ========================================= -->

            <div class="section-title">
                TRANSACTION HISTORY
            </div>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th></th>
                            <th>USERNAME</th>
                            <th>BOOK TITLE</th>
                            <th>ISBN</th>
                            <th style="text-align: center;">REQUEST DATE</th>
                            <th style="text-align: center;">DUE DATE</th>
                            <th style="text-align: center;">RETURN DATE</th>
                            <th style="text-align: center;">FINE</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="loanLog: ${loanHistory}">

                            <td class="action">
                                <span class="action-label" th:text="${loanLog.loanStatus}"
                                    th:classappend="${loanLog.loanStatus == 'COMPLETED'} ? ' loan-done-status' : ' loan-status'">
                                </span>
                            </td>

                            <td th:text="${loanLog.username}"></td>

                            <td th:text="${loanLog.bookTitle}"></td>

                            <td class="isbn" th:text="${loanLog.isbn}"></td>

                            <td style="text-align: center;" th:text="${loanLog.requestDate}"></td>

                            <td style="text-align: center;" th:text="${loanLog.dueDate}">

                            <td style="text-align: center;"
                                th:text="${loanLog.returnDate != null ? loanLog.returnDate : '—'}"></td>

                            <td class="fine"
                                th:classappend="${loanLog.fine != null and loanLog.fine > 0} ? ' has-fine' : ' no-fine'"
                                th:text="${loanLog.fine != null and loanLog.fine > 0 ? loanLog.fine + ' €' : '—'}"></td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</body>

</html>
