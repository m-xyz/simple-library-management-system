<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Library - Singup</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;
            color: #000000;

            font-family: "Courier New", monospace;
            font-size: 14px;

            /* 1-bit Macintosh desktop texture */
            background-image:
                radial-gradient(#000 0.6px, transparent 0.6px);
            background-size: 4px 4px;

            padding: 20px;
        }


        /* MAIN WINDOW */

        .window {
            width: 480px;

            background: #fff;

            border: 3px solid #000;

            box-shadow:
                6px 6px 0 #000;
        }


        /* TITLE BAR */

        .title-bar {
            height: 34px;

            display: flex;
            align-items: center;

            position: relative;

            border-bottom: 3px solid #000;

            padding: 0 8px;
        }


        /* Macintosh window icon */

        .window-icon {
            width: 16px;
            height: 16px;

            border: 2px solid #000;

            margin-right: 10px;

            background:
                linear-gradient(to bottom,
                    #000 0px,
                    #000 2px,
                    #fff 2px,
                    #fff 4px);

            background-size: 100% 4px;
        }


        .title {
            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            background: #fff;

            padding: 0 12px;

            font-weight: bold;

            letter-spacing: 1px;
        }


        /* CONTENT */

        .content {
            padding: 25px;
        }


        .header {
            text-align: center;

            margin-bottom: 22px;
        }


        .header h1 {
            margin: 0 0 8px 0;

            font-size: 22px;

            text-transform: uppercase;
        }


        .header p {
            margin: 0;

            font-size: 13px;
        }


        /* FORM */

        .form-group {
            margin-bottom: 16px;
        }


        label {
            display: block;

            margin-bottom: 6px;

            font-weight: bold;
        }


        input {
            width: 100%;

            padding: 9px;

            border: 2px solid #000;

            background: #fff;

            color: #000;

            font-family: "Courier New", monospace;

            font-size: 14px;

            outline: none;
        }


        input:focus {
            background: #000;

            color: #fff;
        }


        /* VALIDATION ERRORS */

        .field-error {
            margin-top: 5px;

            color: #cc0000;

            font-weight: bold;

            font-size: 12px;
        }


        .field-error::before {
            content: "ERROR: ";
        }


        /* ROLE SELECTION */

        .role-section {
            margin-top: 22px;

            margin-bottom: 20px;

            border: 2px solid #000;

            padding: 12px;
        }


        .role-title {
            font-weight: bold;

            margin-bottom: 12px;

            padding-bottom: 6px;

            border-bottom: 1px solid #000;
        }


        .role-options {
            display: flex;

            gap: 12px;
        }


        .role-option {
            flex: 1;

            position: relative;
        }


        .role-option input {
            position: absolute;

            opacity: 0;

            pointer-events: none;
        }


        .role-option label {
            display: block;

            padding: 10px;

            border: 2px solid #000;

            text-align: center;

            cursor: pointer;

            font-weight: bold;

            margin: 0;
        }


        .role-option label:hover {
            background: #000;

            color: #fff;
        }


        /* Selected radio button */

        .role-option input:checked+label {
            background: #000;

            color: #fff;
        }


        .role-option input:checked+label::before {
            content: "[X] ";
        }


        .role-option input:not(:checked)+label::before {
            content: "[ ] ";
        }


        /* REGISTER BUTTON */

        .register-button {
            width: 100%;

            padding: 10px;

            margin-top: 5px;

            border: 2px solid #000;

            background: #fff;

            color: #000;

            font-family: "Courier New", monospace;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                3px 3px 0 #000;
        }


        .register-button:hover {
            background: #000;

            color: #fff;
        }


        .register-button:active {
            transform: translate(2px, 2px);

            box-shadow:
                1px 1px 0 #000;
        }


        /* LOGIN LINK */

        .login-link {
            text-align: center;

            margin-top: 25px;

            padding-top: 15px;

            border-top: 3px double #000;
        }


        .login-link a {
            color: #000;

            font-weight: bold;

            text-decoration: underline;
        }


        .login-link a:hover {
            background: #000;

            color: #fff;

            text-decoration: none;
        }


        /* STATUS BAR */

        .status-bar {

            display: flex;

            justify-content: space-between;

            margin-top: 20px;

            padding-top: 8px;

            border-top: 1px solid #000;

            font-size: 11px;
        }


        .status-indicator {
            display: inline-block;

            width: 9px;
            height: 9px;

            border: 2px solid #000;

            margin-right: 4px;

            vertical-align: middle;
        }


        /* MOBILE */

        @media (max-width: 520px) {

            body {
                padding: 15px;
            }

            .window {
                width: 100%;
            }

            .role-options {
                flex-direction: column;
            }

        }
    </style>

</head>

<body>

    <div class="window">

        <!-- Macintosh title bar -->

        <div class="title-bar">

            <div class="window-icon"></div>

            <div class="title">
                Library - Signup
            </div>

        </div>


        <div class="content">


            <!-- Header -->

            <div class="header">

                <h1>
                    Create An Account
                </h1>

                <p>
                    Enter your information to register.
                </p>

            </div>


            <!-- Signup form -->

            <form th:action="@{/signup}" th:object="${user}" method="post">


                <!-- Username -->

                <div class="form-group">

                    <label for="username">
                        USERNAME
                    </label>

                    <input type="text" id="username" th:field="*{username}" autocomplete="username" required>

                    <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">
                    </div>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        EMAIL
                    </label>

                    <input type="email" id="email" th:field="*{email}" autocomplete="email" required>

                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                    </div>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        PASSWORD
                    </label>

                    <input type="password" id="password" th:field="*{password}" autocomplete="new-password" required>

                    <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                    </div>

                </div>


                <!-- Role -->

                <div class="role-section">

                    <div class="role-title">
                        ACCOUNT TYPE
                    </div>


                    <div class="role-options">


                        <!-- Client -->

                        <div class="role-option">

                            <input type="radio" id="client" th:field="*{role}" value="CLIENT" required>

                            <label for="client">
                                CLIENT
                            </label>

                        </div>


                        <!-- Owner -->

                        <div class="role-option">

                            <input type="radio" id="owner" th:field="*{role}" value="OWNER" required>

                            <label for="owner">
                                OWNER
                            </label>

                        </div>


                    </div>


                    <div class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">
                    </div>

                </div>


                <!-- Register -->

                <button type="submit" class="register-button">

                    CREATE ACCOUNT

                </button>


            </form>


            <!-- Login -->

            <div class="login-link">

                <div>
                    Already have an account?
                </div>

                <br>

                <a th:href="@{/login}">
                    RETURN TO LOGIN
                </a>

            </div>

        </div>

    </div>

</body>

</html>
