<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>


    <meta charset="UTF-8">

    <title>Library - Return books</title>

    <link rel="stylesheet" th:href="@{/css/return-book.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">

</head>

<body>

    <div class="window">

        <!-- ============================================= -->
        <!-- MACINTOSH TITLE BAR                           -->
        <!-- ============================================= -->

        <div class="title-bar">

            <form th:action="@{/logout}" method="post" class="logout-form">

                <button type="submit" class="logout-button" title="Log Out">
                    ×
                </button>

            </form>

            <div class="title">
                LIBRARY - BOOK LOANS
            </div>

        </div>

        <!-- ============================================= -->
        <!-- CONTENT                                       -->
        <!-- ============================================= -->

        <div class="content">

            <!-- ========================================= -->
            <!-- WELCOME                                   -->
            <!-- ========================================= -->

            <div class="welcome">

                <div class="back-bar">
                    <a th:href="@{/client}" class="back-button">
                        < BACK </a>
                </div>

                <div class="datetime">

                    <div>
                        <span id="current-date"></span>
                    </div>

                    <div>
                        <span id="current-time"></span>
                    </div>

                </div>

            </div>

            <!-- ========================================= -->
            <!-- RETURNED BOOKS                            -->
            <!-- ========================================= -->

            <div class="section-title">
                CURRENT LOANS
            </div>

            <div class="table-wrapper">

                <form th:action="@{/client/return-book}" method="post" id="return-form">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    <input type="checkbox" id="select-all">
                                </th>
                                <th>ISBN</th>
                                <th>TITLE</th>
                                <th>DUE DATE</th>
                                <th>STATUS</th>
                                <th>FINE</th>

                            </tr>

                        </thead>

                        <tbody>

                            <!-- ================================= -->
                            <!-- LOANS                             -->
                            <!-- ================================= -->

                            <tr th:each="loan : ${bookLoans}"
                                th:with="loanFine=${loan.calculateFine(appProperties.getLateReturnFee())}">

                                <td>
                                    <input type="checkbox" class="loan-checkbox" name="loanIds"
                                        th:value="${loan.id.transactionId + ':' + loan.id.isbn}">
                                </td>

                                <td class="isbn" th:text="${loan.book.isbn}"></td>

                                <td class="book-title" th:text="${loan.book.title}"></td>

                                <td class="date" th:text="${#temporals.format(loan.transaction.dueDate, 'dd/MM/yyyy')}">

                                </td>

                                <td class="status">
                                    <span th:if="${#temporals.createToday().isAfter(loan.transaction.dueDate)}"
                                        class="overdue"
                                        th:text="${'OVERDUE (' +
          T(java.time.temporal.ChronoUnit).DAYS.between(loan.transaction.dueDate, #temporals.createToday()) +
          (T(java.time.temporal.ChronoUnit).DAYS.between(loan.transaction.dueDate, #temporals.createToday()) == 1 ? ' day late)' : ' days late)')}">
                                    </span>

                                    <span th:unless="${#temporals.createToday().isAfter(loan.transaction.dueDate)}"
                                        class="on-time">
                                        ON TIME
                                    </span>
                                </td>

                                <td class="fine">
                                    <span th:if="${loanFine.compareTo(T(java.math.BigDecimal).ZERO) > 0}"
                                        class="fine-due" th:text="${loanFine + ' €'}">
                                    </span>

                                    <span th:unless="${loanFine.compareTo(T(java.math.BigDecimal).ZERO) > 0}"
                                        class="fine-none">
                                        0.00 €
                                    </span>
                                </td>

                            </tr>

                            <!-- ================================= -->
                            <!-- WAITING LIST                      -->
                            <!-- ================================= -->

                            <tr th:each="entry : ${waitingListEntries}" class="waiting-list-row">

                                <td></td>

                                <td class="isbn" th:text="${entry.book.isbn}"></td>

                                <td class="book-title" th:text="${entry.book.title}"></td>

                                <td class="date"></td>

                                <td>
                                    <span class="waiting">
                                        ON WAITLIST
                                        (<span th:text="${entry.position}"></span>)
                                    </span>
                                </td>

                                <td class="fine"></td>

                            </tr>

                            <!-- ================================= -->
                            <!-- EMPTY STATE                       -->
                            <!-- ================================= -->

                            <tr th:if="${#lists.isEmpty(bookLoans)}">

                                <td colspan="6" class="empty-message">
                                    NO BOOKS CURRENTLY ON LOAN
                                </td>

                            </tr>

                        </tbody>

                    </table>

                    <!-- ========================================= -->
                    <!-- RETURN BUTTON                             -->
                    <!-- ========================================= -->

                    <div class="return-bar">

                        <button type="submit" class="return-button" id="return-button" disabled>
                            RETURN
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script>

        /* DATE / TIME */

        function updateDateTime() {

            const now = new Date();

            const date = now.toLocaleDateString("en-GB", {

                day: "2-digit",

                month: "2-digit",

                year: "numeric"

            });

            const time = now.toLocaleTimeString("en-GB", {

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit"

            });

            document.getElementById("current-date").textContent = date;

            document.getElementById("current-time").textContent = time;

        }

        updateDateTime();

        setInterval(updateDateTime, 1000);

        const checkboxes =
            document.querySelectorAll(".loan-checkbox");

        const returnButton =
            document.getElementById("return-button");

        const selectAll =
            document.getElementById("select-all");


        /* ENABLE RETURN BUTTON ONLY WHEN AT LEAST ONE BOOK IS SELECTED */

        function updateReturnButton() {

            const selected =
                document.querySelectorAll(
                    ".loan-checkbox:checked"
                ).length;

            returnButton.disabled = selected === 0;

        }

        /* SELECT/DESELECT ALL BOOKS */

        selectAll.addEventListener("change", function () {

            checkboxes.forEach(function (checkbox) {

                checkbox.checked = selectAll.checked;

            });

            updateReturnButton();

        });

        /* UPDATE SELECT-ALL CHECKBOX WHEN INDIVIDUAL CHECKBOXES CHANGE */

        checkboxes.forEach(function (checkbox) {

            checkbox.addEventListener("change", function () {

                updateReturnButton();

                selectAll.checked =
                    [...checkboxes].every(
                        checkbox => checkbox.checked
                    );

            });

        });

        updateReturnButton();

    </script>

</body>

</html>
