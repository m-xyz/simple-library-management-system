<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>


    <meta charset="UTF-8">

    <title>Library - Return books</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background: #ffffff;
            color: #000000;

            font-family: "Courier New", monospace;
            font-size: 14px;

            background-image:
                radial-gradient(#000 0.6px, transparent 0.6px);

            background-size: 4px 4px;
        }

        .window {
            width: 94%;
            max-width: 1200px;

            margin: 35px auto;

            background: #ffffff;

            border: 3px solid #000;

            box-shadow:
                6px 6px 0 #000;
        }

        .title-bar {
            height: 34px;

            display: flex;
            align-items: center;

            border-bottom: 3px solid #000;

            background: #fff;

            padding: 0 8px;

            position: relative;
        }

        .logout-form {
            margin: 0;
            padding: 0;

            z-index: 2;
        }

        .logout-button {
            width: 18px;
            height: 18px;

            padding: 0;

            background: #fff;
            color: #000;

            border: 2px solid #000;

            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;

            line-height: 12px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-button:hover {
            background: #000;
            color: #fff;
        }

        .title {
            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            background: #fff;

            padding: 0 12px;

            font-weight: bold;

            letter-spacing: 1px;
        }

        .content {
            padding: 25px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 22px;

            margin: 0 0 8px 0;

            text-transform: uppercase;
        }

        .welcome h1 .username {
            text-transform: none;
        }

        .welcome h1 span {
            background: #000;

            color: #fff;

            padding: 2px 6px;
        }

        .datetime {
            display: flex;

            justify-content: flex-start;

            gap: 20px;

            font-size: 13px;

            font-weight: bold;
        }

        .datetime span {
            background: #000;

            color: #fff;

            padding: 2px 6px;
        }

        .section-title {
            font-weight: bold;

            margin-bottom: 8px;

            padding: 5px 8px;

            border: 2px solid #000;

            background: #000;

            color: #fff;

            letter-spacing: 1px;
        }

        .table-wrapper {
            border: 2px solid #000;

            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            background: #fff;
        }

        th {
            background: #fff;

            border-bottom: 3px double #000;

            padding: 10px;

            text-align: left;

            font-weight: bold;

            text-transform: uppercase;
        }

        td {
            padding: 10px;

            border-bottom: 1px solid #000;
        }

        tbody tr:nth-child(even) {
            background:
                repeating-linear-gradient(45deg,
                    #fff,
                    #fff 2px,
                    #000 2px,
                    #000 3px);

            background-size: 5px 5px;
        }

        tbody tr:nth-child(even) td {
            background: rgba(255, 255, 255, 0.88);
        }

        tbody tr:hover td {
            background: #000;

            color: #fff;
        }

        .isbn {
            font-family: "Courier New", monospace;

            font-weight: bold;
        }

        .book-title {
            font-weight: bold;
        }

        .date {
            white-space: nowrap;
        }

        .fine {
            font-weight: bold;

            white-space: nowrap;
        }

        .fine-none {
            font-weight: bold;
        }

        .fine-none:hover {
            font-weight: bold;
        }

        .fine-due {
            background: #ff0000;

            color: #fff;

            padding: 2px 5px;
        }

        .overdue {
            font-weight: bold;

            text-decoration: underline;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;

            width: 18px;
            height: 18px;

            border: 2px solid #000;

            background: #fff;

            cursor: pointer;

            vertical-align: middle;
        }

        input[type="checkbox"]:checked {
            background: #000;

            position: relative;
        }

        input[type="checkbox"]:checked::after {
            content: "✓";

            color: #fff;

            font-family: "Courier New", monospace;

            font-size: 14px;

            font-weight: bold;

            position: absolute;

            left: 2px;
            top: -2px;
        }

        .return-bar {
            display: flex;

            justify-content: center;

            margin-top: 25px;

            padding-top: 16px;

            padding-bottom: 16px;

            border-top: 3px double #000;
        }

        .return-button {
            min-width: 210px;

            padding: 8px 14px;

            background: #000;

            color: #fff;

            border: 1px solid #000;

            box-shadow:
                3px 3px 0 #000;

            font-family: "Courier New", monospace;

            font-weight: bold;

            cursor: pointer;

            text-align: center;
        }

        .return-button:hover {
            background: #fff;

            color: #000;
        }

        .return-button:active {
            transform: translate(2px, 2px);

            box-shadow:
                1px 1px 0 #000;
        }

        .return-button:disabled {
            background: #ccc;

            color: #666;

            border-color: #888;

            cursor: not-allowed;

            box-shadow:
                3px 3px 0 #888;
        }

        .back-bar {
            display: flex;

            gap: 12px;

            margin-bottom: 28px;
        }

        .back-button {
            display: inline-block;

            min-width: 150px;

            padding: 8px 14px;

            color: #000;

            background: #fff;

            border: 1px solid #000;

            text-decoration: none;

            font-family: "Courier New", monospace;

            font-weight: bold;

            text-align: center;

            box-shadow:
                3px 3px 0 #000;
        }

        .back-button:hover {
            background: #000;

            color: #fff;
        }

        .back-button:active {
            transform: translate(2px, 2px);

            box-shadow:
                1px 1px 0 #000;
        }

        .empty-message {
            padding: 25px;

            text-align: center;

            font-weight: bold;
        }

        .status-bar {
            display: flex;

            justify-content: space-between;

            margin-top: 25px;

            border-top: 3px double #000;

            padding-top: 8px;

            font-size: 12px;
        }

        .status-indicator {
            display: inline-block;

            width: 10px;
            height: 10px;

            border: 2px solid #000;

            margin-right: 5px;

            vertical-align: middle;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .content {
                padding: 15px;
            }

            .window {
                width: 96%;

                margin: 15px auto;
            }

            .datetime {
                flex-direction: column;

                gap: 6px;
            }

        }
    </style>

</head>

<body>

    <div class="window">

        <!-- ============================================= -->
        <!-- MACINTOSH TITLE BAR                           -->
        <!-- ============================================= -->

        <div class="title-bar">

            <form th:action="@{/logout}" method="post" class="logout-form">

                <button type="submit" class="logout-button" title="Log Out">
                    ×
                </button>

            </form>

            <div class="title">
                LIBRARY - BOOK LOANS
            </div>

        </div>

        <!-- ============================================= -->
        <!-- CONTENT                                       -->
        <!-- ============================================= -->

        <div class="content">

            <!-- ========================================= -->
            <!-- WELCOME                                   -->
            <!-- ========================================= -->

            <div class="welcome">

                <div class="back-bar">
                    <a th:href="@{/client}" class="back-button">
                        < BACK </a>
                </div>

                <div class="datetime">

                    <div>
                        <span id="current-date"></span>
                    </div>

                    <div>
                        <span id="current-time"></span>
                    </div>

                </div>

            </div>

            <!-- ========================================= -->
            <!-- RETURNED BOOKS                            -->
            <!-- ========================================= -->

            <div class="section-title">
                CURRENT LOANS
            </div>

            <div class="table-wrapper">

                <form th:action="@{/client/return-book}" method="post" id="return-form">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    <input type="checkbox" id="select-all">
                                </th>
                                <th>ISBN</th>
                                <th>TITLE</th>
                                <th>DUE DATE</th>
                                <th>STATUS</th>
                                <th>FINE</th>

                            </tr>

                        </thead>

                        <tbody>

                            <!-- ================================= -->
                            <!-- LOANS                             -->
                            <!-- ================================= -->

                            <tr th:each="loan : ${bookLoans}"
                                th:with="loanFine=${loan.calculateFine(appProperties.getLateReturnFee())}">

                                <td>
                                    <input type="checkbox" class="loan-checkbox" name="loanIds"
                                        th:value="${loan.id.transactionId + ':' + loan.id.isbn}">
                                </td>

                                <td class="isbn" th:text="${loan.book.isbn}"></td>

                                <td class="book-title" th:text="${loan.book.title}"></td>

                                <td class="date" th:text="${#temporals.format(loan.transaction.dueDate, 'dd/MM/yyyy')}">

                                </td>

                                <td>
                                    <span th:if="${#temporals.createToday().isAfter(loan.transaction.dueDate)}"
                                        class="overdue">
                                        OVERDUE
                                    </span>

                                    <span th:unless="${#temporals.createToday().isAfter(loan.transaction.dueDate)}">
                                        ON TIME
                                    </span>
                                </td>

                                <td class="fine">
                                    <span th:if="${loanFine.compareTo(T(java.math.BigDecimal).ZERO) > 0}"
                                        class="fine-due" th:text="${loanFine + ' €'}">
                                    </span>

                                    <span th:unless="${loanFine.compareTo(T(java.math.BigDecimal).ZERO) > 0}"
                                        class="fine-none">
                                        0.00 €
                                    </span>
                                </td>

                            </tr>

                            <!-- ================================= -->
                            <!-- EMPTY STATE                       -->
                            <!-- ================================= -->

                            <tr th:if="${#lists.isEmpty(bookLoans)}">

                                <td colspan="6" class="empty-message">
                                    NO BOOKS CURRENTLY ON LOAN
                                </td>

                            </tr>

                        </tbody>

                    </table>

                    <!-- ========================================= -->
                    <!-- RETURN BUTTON                             -->
                    <!-- ========================================= -->

                    <div class="return-bar">

                        <button type="submit" class="return-button" id="return-button" disabled>
                            RETURN
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script>

        /* DATE / TIME */

        function updateDateTime() {

            const now = new Date();

            const date = now.toLocaleDateString("en-GB", {

                day: "2-digit",

                month: "2-digit",

                year: "numeric"

            });

            const time = now.toLocaleTimeString("en-GB", {

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit"

            });

            document.getElementById("current-date").textContent = date;

            document.getElementById("current-time").textContent = time;

        }

        updateDateTime();

        setInterval(updateDateTime, 1000);

        const checkboxes =
            document.querySelectorAll(".loan-checkbox");

        const returnButton =
            document.getElementById("return-button");

        const selectAll =
            document.getElementById("select-all");


        /* ENABLE RETURN BUTTON ONLY WHEN AT LEAST ONE BOOK IS SELECTED */

        function updateReturnButton() {

            const selected =
                document.querySelectorAll(
                    ".loan-checkbox:checked"
                ).length;

            returnButton.disabled = selected === 0;

        }

        /* SELECT/DESELECT ALL BOOKS */

        selectAll.addEventListener("change", function () {

            checkboxes.forEach(function (checkbox) {

                checkbox.checked = selectAll.checked;

            });

            updateReturnButton();

        });

        /* UPDATE SELECT-ALL CHECKBOX WHEN INDIVIDUAL CHECKBOXES CHANGE */

        checkboxes.forEach(function (checkbox) {

            checkbox.addEventListener("change", function () {

                updateReturnButton();

                selectAll.checked =
                    [...checkboxes].every(
                        checkbox => checkbox.checked
                    );

            });

        });

        updateReturnButton();

    </script>

</body>

</html>
