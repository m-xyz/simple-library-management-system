<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <title>Library</title>

    <link rel="stylesheet" th:href="@{/css/client.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">

</head>

<body>

    <div class="window">

        <!-- ============================================= -->
        <!-- MACINTOSH TITLE BAR                           -->
        <!-- ============================================= -->

        <div class="title-bar">

            <!-- LOGOUT -->

            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="logout-button" title="Log Out">
                    ×
                </button>
            </form>

            <!-- WINDOW TITLE -->

            <div class="title">
                LIBRARY
            </div>

        </div>

        <!-- ============================================= -->
        <!-- CONTENT                                       -->
        <!-- ============================================= -->

        <div class="content">
            <!-- ========================================= -->
            <!-- ERROR MESSAGE                             -->
            <!-- ========================================= -->
            <div class="error-message" th:if="${errorMessage}">
                <div class="error-icon"> ! </div>
                <div class="error-text" th:text="${errorMessage}"></div>
            </div>

            <!-- ========================================= -->
            <!-- SUCCESS MESSAGE                           -->
            <!-- ========================================= -->
            <div class="success-message" th:if="${successMessage}">
                <div class="success-icon"> ✓ </div>
                <div class="success-text" th:text="${successMessage}"></div>
            </div>

            <!-- ========================================= -->
            <!-- RETURN BOOK(S) MESSAGE                    -->
            <!-- ========================================= -->
            <div th:if="${successMessages}" class="success-messages">
                <div th:each="message : ${successMessages}" class="success-message" th:text="${message}"></div>
            </div>

            <!-- ========================================= -->
            <!-- WELCOME                                   -->
            <!-- ========================================= -->

            <div class="welcome">

                <h1>
                    Welcome,
                    <span class="username" th:text="${username}">
                        USERNAME
                    </span>
                </h1>

                <div class="datetime">

                    <div>
                        <span id="current-date"></span>
                    </div>

                    <div>
                        <span id="current-time"></span>
                    </div>

                </div>

            </div>

            <!-- ========================================= -->
            <!-- CLIENT ACTIONS                            -->
            <!-- ========================================= -->

            <div class="toolbar">

                <a th:href="@{/client/return-book}" class="mac-button">
                    MY LOANS
                </a>

            </div>

            <!-- ========================================= -->
            <!-- BOOK INVENTORY                            -->
            <!-- ========================================= -->

            <div class="section-title">
                AVAILABLE BOOKS
            </div>

            <form th:action="@{/client/borrow}" method="post">
                <div class="table-wrapper">

                    <table>
                        <thead>
                            <tr>
                                <th></th>
                                <th>ISBN</th>
                                <th>TITLE</th>
                                <th>AUTHOR</th>
                                <th>STOCK</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="book : ${books}"
                                th:classappend="${duplicateIsbns != null and duplicateIsbns.contains(book.isbn)} ? ' duplicate-book' : ''">
                                <td>
                                    <input type="checkbox" class="book-checkbox" name="isbns" th:value="${book.isbn}"
                                        th:disabled="${book.stock <= 0}"
                                        th:checked="${selectedIsbns != null and selectedIsbns.contains(book.isbn)}">

                                    <button type="button" class="waitlist-button" th:if="${book.stock <= 0}"
                                        th:with="waitlistCount=${waitingListService.getCountByBook(book.isbn)}" th:attr="
                                        data-isbn=${book.isbn},
                                        data-title=${book.title},
                                        data-waitlist-count=${waitlistCount}
                                    " onclick="openWaitlistWindow(
                                        this.dataset.isbn,
                                        this.dataset.title,
                                        this.dataset.waitlistCount
                                    )" th:text="|WAITLIST (${waitlistCount})|">
                                    </button>
                                </td>
                                <td th:text="${book.isbn}"></td>
                                <td th:text="${book.title}"></td>
                                <td th:text="${book.author.name}"></td>
                                <td th:text="${book.stock}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="borrow-bar">

                    <button type="submit" class="mac-button borrow-button" id="borrow-button" disabled>
                        BORROW
                    </button>

                </div>
            </form>

        </div>

    </div>
    <template id="waitlist-window-template">

        <div class="waitlist-window">

            <div class="waitlist-title-bar">

                <button type="button" class="waitlist-close">
                    ×
                </button>

                <div class="waitlist-title">
                    JOIN WAITING LIST
                </div>

            </div>

            <div class="waitlist-content">

                <div class="waitlist-message">

                    Do you want to join the waiting list for

                    <span class="waitlist-book-title"></span> ?

                    <div class="waitlist-count">
                        Waitlist for this book:
                        <span class="waitlist-user-count"></span>
                        users
                    </div>

                </div>

                <div class="waitlist-actions">

                    <button type="button" class="waitlist-confirm">
                        [YES]
                    </button>

                    <button type="button" class="waitlist-cancel">
                        [NO]
                    </button>

                </div>

            </div>

        </div>

    </template>

    <script>

        function waitListMessage(message, messageType) {
            const waitListMessage = document.createElement("div");
            waitListMessage.className = `${messageType}-message`;

            waitListMessage.innerHTML = `
                <div class="${messageType}-icon">!</div>
                <div class="${messageType}-text">${message}</div>
            `;

            document.querySelector(".content").prepend(waitListMessage);
        }

        if (sessionStorage.getItem("joinWaitlistSuccess")) {
            waitListMessage(sessionStorage.getItem("joinWaitlistSuccess"), "success");
            sessionStorage.removeItem("joinWaitlistSuccess");
        }

        if (sessionStorage.getItem("joinWaitlistFail")) {
            waitListMessage(sessionStorage.getItem("joinWaitlistFail"), "error");
            sessionStorage.removeItem("joinWaitlistFail");
        }

        function updateDateTime() {

            const now = new Date();


            const date = now.toLocaleDateString("en-GB", {

                day: "2-digit",

                month: "2-digit",

                year: "numeric"

            });


            const time = now.toLocaleTimeString("en-GB", {

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit"

            });


            document.getElementById("current-date").textContent = date;

            document.getElementById("current-time").textContent = time;

        }

        updateDateTime();

        setInterval(updateDateTime, 1000);

        const checkboxes = document.querySelectorAll(".book-checkbox");
        const borrowButton = document.getElementById("borrow-button");
        function updateBorrowButton() {
            const selected = document.querySelectorAll(".book-checkbox:checked").length;
            borrowButton.disabled = selected === 0;
        }
        checkboxes.forEach(function (checkbox) {
            checkbox.addEventListener("change", updateBorrowButton);
        }); updateBorrowButton();

        function openWaitlistWindow(isbn, title, waitlistCount) {

            const csrfToken =
                document.querySelector('meta[name="_csrf"]').content;

            const csrfHeader =
                document.querySelector('meta[name="_csrf_header"]').content;

            const template =
                document.getElementById("waitlist-window-template");

            const windowElement =
                template.content.firstElementChild.cloneNode(true);

            document.body.appendChild(windowElement);

            windowElement.querySelector(".waitlist-book-title")
                .textContent = title;

            windowElement.querySelector(".waitlist-user-count")
                .textContent = waitlistCount;

            const closeWindow = () => {
                windowElement.remove();
            };

            windowElement.querySelector(".waitlist-close")
                .addEventListener("click", closeWindow);

            windowElement.querySelector(".waitlist-cancel")
                .addEventListener("click", closeWindow);

            windowElement.querySelector(".waitlist-confirm")
                .addEventListener("click", async function () {

                    try {

                        const response = await fetch(
                            `/client/waitlist/${encodeURIComponent(isbn)}`,
                            {
                                method: "POST",
                                headers: {
                                    [csrfHeader]: csrfToken
                                }
                            }
                        );

                        if (!response.ok) {
                            throw new Error(await response.text());
                        }

                        sessionStorage.setItem("joinWaitlistSuccess", await response.text());
                        closeWindow();
                        location.reload();

                    } catch (error) {
                        sessionStorage.setItem("joinWaitlistFail", error.message);
                        closeWindow();
                        location.reload();
                    }

                });
        }

    </script>

</body>

</html>
