<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <title>Simple Library Management System</title>

    <link rel="stylesheet" th:href="@{/css/owner.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">

</head>

<body>

    <!-- ================================================= -->
    <!-- MAIN MACINTOSH WINDOW                             -->
    <!-- ================================================= -->

    <div class="window">

        <!-- Macintosh title bar -->

        <div class="title-bar">

            <!-- Logout / close button -->

            <form th:action="@{/logout}" method="post" class="logout-form">

                <button type="submit" class="logout-button" title="Log Out">
                    ×
                </button>

            </form>

            <div class="title">
                Simple Library Management System
            </div>

        </div>

        <div class="content">

            <div id="success-message-container"></div>

            <div class="success-message" th:if="${addBookSuccessMessage}">
                <div class="success-icon"> ✓ </div>
                <div class="success-text" th:text="${addBookSuccessMessage}"></div>
            </div>

            <!-- ================================================= -->
            <!-- HEADER                                            -->
            <!-- ================================================= -->

            <div class="welcome">

                <h1>

                    Logged in as

                    <span class="username" th:text="${username}">
                        USERNAME
                    </span>

                </h1>

                <div class="datetime">

                    <div>
                        <span id="current-date"></span>
                    </div>

                    <div>
                        <span id="current-time"></span>
                    </div>

                </div>

            </div>

            <!-- ================================================= -->
            <!-- MAIN BUTTONS                                      -->
            <!-- ================================================= -->

            <div class="toolbar">

                <a th:href="@{/owner/add-book}" class="mac-button">
                    [+] BOOK
                </a>


                <a th:href="@{/owner/loan-history}" class="mac-button">
                    LOAN HISTORY
                </a>

            </div>

            <!-- ================================================= -->
            <!-- INVENTORY                                         -->
            <!-- ================================================= -->

            <div class="section-title">
                BOOK INVENTORY
            </div>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th></th>
                            <th>ISBN</th>
                            <th>TITLE</th>
                            <th>AUTHOR</th>
                            <th style="text-align: center;">STOCK</th>
                            <th style="text-align: center;">ON LOAN</th>
                        </tr>

                    </thead>

                    <tbody>
                        <tr th:each="book : ${books}"
                            th:with="loanCount=${bookLoanService.getOnLoanCountByIsbn(book.isbn)}">
                            <td>
                                <button type="button" class="decommission-button">
                                    [X]
                                </button>
                                <button type="button" class="edit-button" th:attr="
                                        data-isbn=${book.isbn},
                                        data-title=${book.title},
                                        data-author=${book.author.name},
                                        data-stock=${book.stock}," onclick="openEditWindow(
                                        this.dataset.isbn,
                                        this.dataset.title,
                                        this.dataset.author,
                                        this.dataset.stock,
                                    )">
                                    [EDIT]
                                </button>
                                <button type="button" class="decommission-button" th:attr="data-isbn=${book.isbn},
                                    data-title=${book.title},
                                    data-decommissioned=${book.decommissioned}"
                                    th:text="${book.decommissioned} ? [A] : [D]"
                                    onclick="openDecommWindow(this.dataset.isbn, this.dataset.title, this.dataset.decommissioned)">
                                </button>
                            </td>
                            <td th:text="${book.isbn}"></td>
                            <td>
                                <span th:text="${book.title}"></span>
                                <span th:if="${book.decommissioned}" class="decomm-tag">
                                    [DECOMMISSIONED]
                                </span>
                            </td>
                            <td th:text="${book.author.name}"></td>
                            <td style="text-align: center;" th:text="${book.stock}"></td>
                            <td style="text-align: center;">
                                <button type="button" class="loan-count" th:text="${loanCount}" th:attr="
                                    data-isbn=${book.isbn},
                                    data-fee=${loanLateFee}" th:disabled="${loanCount == 0}"
                                    th:onclick="${loanCount > 0} ? 'openLoanWindow(this.dataset.isbn, this.dataset.fee)' : null">
                                </button>
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- ===================================================== -->
    <!-- DRAGGABLE LOAN INFORMATION WINDOW                     -->
    <!-- ===================================================== -->

    <template id="loan-window-template">


        <div class="loan-window">

            <div class="loan-title-bar">

                <button type="button" class="loan-close">
                    ×
                </button>

                <div class="loan-title">
                    LOAN INFORMATION
                </div>

            </div>

            <div class="loan-content">

                <div class="loan-heading">

                    <div>
                        ISBN:
                        <span class="loan-isbn"></span>
                    </div>

                    <div>
                        BOOK:
                        <span class="loan-book-title"></span>
                    </div>

                </div>


                <div class="loan-section-title">
                    CURRENTLY ON LOAN
                </div>


                <div class="loan-table-wrapper">

                    <table class="loan-table">

                        <thead>

                            <tr>
                                <th style="text-align: center;">USERNAME</th>
                                <th style="text-align: center;">REQUEST DATE</th>
                                <th style="text-align: center;">DUE DATE</th>
                                <th style="text-align: center;">CURRENT FINE</th>
                            </tr>

                        </thead>

                        <tbody class="loan-users" style="text-align: center;"></tbody>

                    </table>

                </div>

            </div>

        </div>

    </template>

    <template id="decommission-window-template">

        <div class="decommission-window">

            <div class="decommission-title-bar">

                <button type="button" class="decommission-close">
                    ×
                </button>

                <div class="decommission-title">
                    DECOMMISSION BOOK
                </div>

            </div>

            <div class="decommission-content">

                <div class="decommission-message">
                    <span class="decommission-question"></span>
                    <span class="decommission-book-title"></span> ?
                </div>

                <div class="decommission-actions">

                    <button type="button" class="decommission-confirm">
                        [YES]
                    </button>

                    <button type="button" class="decommission-cancel">
                        [NO]
                    </button>

                </div>

            </div>

        </div>

    </template>

    <template id="edit-window-template">

        <div class="edit-window">

            <div class="edit-title-bar">

                <button type="button" class="edit-close">
                    ×
                </button>

                <div class="edit-title">
                    EDIT BOOK
                </div>

            </div>

            <div class="edit-content">

                <div class="edit-field">

                    <label for="edit-isbn">
                        ISBN
                    </label>

                    <input type="text" id="edit-isbn" class="edit-isbn" readonly>

                </div>

                <div class="edit-field">

                    <label for="edit-title">
                        TITLE
                    </label>

                    <input type="text" id="edit-title" class="edit-book-title">

                </div>

                <div class="edit-field">

                    <label for="edit-author">
                        AUTHOR
                    </label>

                    <input type="text" id="edit-author" class="edit-author">

                </div>

                <div class="edit-field">

                    <label for="edit-stock">
                        STOCK
                    </label>

                    <input type="number" id="edit-stock" class="edit-stock" min="0">

                </div>

                <div class="edit-actions">

                    <button type="button" class="edit-save">
                        [SAVE]
                    </button>

                    <button type="button" class="edit-cancel">
                        [CANCEL]
                    </button>

                </div>

            </div>

        </div>

    </template>

    <script th:inline="javascript">
        const loanData = {};
    </script>

    <script th:each="book : ${books}" th:inline="javascript">
        Object.assign(
            loanData,
            /*[[${bookLoanService.getOnLoanByIsbn(book.isbn)}]]*/
        );
    </script>

    <script>

        function showSuccessMessage(message) {
            const container = document.getElementById("success-message-container");
            container.innerHTML = `
                <div class="success-message">
                    <div class="success-icon">✓</div>
                    <div class="success-text">${message}</div>
                </div>
            `;
        }

        if (sessionStorage.getItem("editBookSuccess")) {
            showSuccessMessage(sessionStorage.getItem("editBookSuccess"));
            sessionStorage.removeItem("editBookSuccess");
        }

        /* ========================================================= */
        /* DATE AND TIME                                             */
        /* ========================================================= */

        function updateDateTime() {

            const now = new Date();


            const date =
                now.toLocaleDateString("en-GB", {

                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"

                });


            const time =
                now.toLocaleTimeString("en-GB", {

                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"

                });


            document.getElementById("current-date")
                .textContent = date;


            document.getElementById("current-time")
                .textContent = time;

        }


        updateDateTime();

        setInterval(updateDateTime, 1000);

        /* ========================================================= */
        /* MULTIPLE DRAGGABLE LOAN WINDOWS                           */
        /* ========================================================= */

        let nextWindowOffset = 0;

        /* ========================================================= */
        /* OPEN A NEW LOAN WINDOW                                    */
        /* ========================================================= */

        async function openLoanWindow(isbn, loanLateFee) {

            const response = await fetch(`/owner/loans/${encodeURIComponent(isbn)}`);

            if (!response.ok) {
                console.error("Failed to retrieved loans for: " + isbn);
                return;
            }

            const loanData = await response.json();
            const book = loanData[isbn];

            if (!book) return;

            / * TEMPLATE */
            const template = document.getElementById("loan-window-template");


            /* Clone the template */
            const windowElement = template.content.firstElementChild.cloneNode(true);


            /* Add it to the page */
            document.body.appendChild(windowElement);


            /* Populate book information */
            windowElement.querySelector(".loan-isbn").textContent = isbn;
            windowElement.querySelector(".loan-book-title").textContent = book.title;

            /* Populate users */
            const tableBody = windowElement.querySelector(".loan-users");

            book.users.forEach(user => {

                const row = document.createElement("tr");
                let daysLate = user.fine / loanLateFee;
                row.innerHTML = `
                    <td>${user.username}</td>
                    <td>${user.requestDate}</td>
                    <td>${user.dueDate}</td>
                    <td>${user.fine} € (${daysLate} ${daysLate == 0 ? 'days' : (daysLate > 1 ? 'days' : 'day')} late)</td>
                `;
                tableBody.appendChild(row);

            });

            /* Window entropy starting pos */

            const offset = nextWindowOffset % 5;
            windowElement.style.left = (180 + offset * 35) + "px";
            windowElement.style.top = (120 + offset * 35) + "px";


            /* Latest windows opened goes to the front */

            bringToFront(windowElement);

            const closeButton = windowElement.querySelector(".loan-close");
            closeButton.addEventListener(
                "click",
                function () {
                    windowElement.remove();
                }
            );

            makeDraggable(
                windowElement,
                windowElement.querySelector(".loan-title-bar")
            );


            /* Bring this window to the front when clicked. */

            windowElement.addEventListener(
                "mousedown",
                function () {
                    bringToFront(windowElement);
                }
            );

        }

        /* ========================================================= */
        /* OPEN DECOMMISSION WINDOW                                  */
        /* ========================================================= */

        function openDecommWindow(isbn, title, decommissioned) {
            decommissioned = decommissioned === "true";
            const csrfToken =
                document.querySelector('meta[name="_csrf"]').content;

            const csrfHeader =
                document.querySelector('meta[name="_csrf_header"]').content;

            const template =
                document.getElementById("decommission-window-template");

            const windowElement =
                template.content.firstElementChild.cloneNode(true);

            document.body.appendChild(windowElement);

            windowElement.querySelector(".decommission-book-title")
                .textContent = title;

            decommissioned ? windowElement.querySelector(".decommission-question")
                .textContent = "Are you sure you want to activate"
                : windowElement.querySelector(".decommission-question")
                    .textContent = "Are you sure you want to decommission";

            const closeWindow = () => {
                windowElement.remove();
            };

            windowElement.querySelector(".decommission-close")
                .addEventListener("click", closeWindow);

            windowElement.querySelector(".decommission-cancel")
                .addEventListener("click", closeWindow);

            windowElement.querySelector(".decommission-confirm")
                .addEventListener("click", async function () {

                    try {
                        const response = await fetch(
                            `/owner/decomm-book/${encodeURIComponent(isbn)}`,
                            {
                                method: "POST",
                                headers: {
                                    [csrfHeader]: csrfToken
                                }
                            }
                        );

                        if (!response.ok) {
                            throw new Error(
                                `Failed to decommission book: ${isbn} HTTP ${response.status}`
                            );
                        }

                        closeWindow();
                        location.reload();
                    } catch (error) {
                        console.log("Error deleting book:", error);
                    }
                });
        }

        /* ========================================================= */
        /* OPEN EDIT WINDOW                                          */
        /* ========================================================= */

        function openEditWindow(isbn, title, author, stock) {
            const csrfToken =
                document.querySelector('meta[name="_csrf"]').content;

            const csrfHeader =
                document.querySelector('meta[name="_csrf_header"]').content;

            const template =
                document.getElementById("edit-window-template");

            const windowElement =
                template.content.firstElementChild.cloneNode(true);

            document.body.appendChild(windowElement);

            /* Fill fields with current values */
            windowElement.querySelector(".edit-isbn").value = isbn;
            windowElement.querySelector(".edit-book-title").value = title;
            windowElement.querySelector(".edit-author").value = author;
            windowElement.querySelector(".edit-stock").value = stock;

            const closeWindow = () => {
                windowElement.remove();
            };

            windowElement.querySelector(".edit-close")
                .addEventListener("click", closeWindow);

            windowElement.querySelector(".edit-cancel")
                .addEventListener("click", closeWindow);

            windowElement.querySelector(".edit-save")
                .addEventListener("click", async function () {

                    const newTitle =
                        windowElement.querySelector(".edit-book-title").value;
                    const newAuthor =
                        windowElement.querySelector(".edit-author").value;
                    const newStock =
                        parseInt(windowElement.querySelector(".edit-stock").value, 10);

                    try {
                        const response = await fetch(
                            `/owner/edit-book/${encodeURIComponent(isbn)}`,
                            {
                                method: "PUT",
                                headers: {
                                    "Content-Type": "application/json",
                                    [csrfHeader]: csrfToken
                                },
                                body: JSON.stringify({
                                    isbn: isbn,
                                    title: newTitle,
                                    author: newAuthor,
                                    stock: newStock,
                                })
                            }
                        );
                        if (!response.ok) {
                            throw new Error(
                                `Failed to update book: ${isbn} HTTP ${response.status}`
                            );
                        }
                        sessionStorage.setItem("editBookSuccess", `Successfully edited '${isbn}'`);
                        windowElement.remove();
                        location.reload();
                    } catch (error) {
                        console.error("Error updating book: ", error);
                    }

                });
        }

        /* ========================================================= */
        /* BRING WINDOW TO FRONT                                     */
        /* ========================================================= */

        let highestZIndex = 1000;

        function bringToFront(windowElement) {

            highestZIndex++;

            windowElement.style.zIndex =
                highestZIndex;

        }

        /* ========================================================= */
        /* MAKE WINDOW DRAGGABLE                                     */
        /* ========================================================= */

        function makeDraggable(windowElement, titleBar) {

            let isDragging = false;

            let offsetX = 0;

            let offsetY = 0;

            titleBar.addEventListener(
                "mousedown",
                function (event) {

                    if (
                        event.target.closest(".loan-close")
                    ) {
                        return;
                    }

                    bringToFront(windowElement);

                    isDragging = true;

                    const rect = windowElement.getBoundingClientRect();

                    offsetX = event.clientX - rect.left;
                    offsetY = event.clientY - rect.top;

                }
            );

            document.addEventListener(
                "mousemove",
                function (event) {

                    if (!isDragging) return

                    let newX = event.clientX - offsetX;
                    let newY = event.clientY - offsetY;

                    const maxX =
                        window.innerWidth -
                        windowElement.offsetWidth;

                    const maxY =
                        window.innerHeight -
                        windowElement.offsetHeight;

                    newX =
                        Math.max(
                            0,
                            Math.min(newX, maxX)
                        );

                    newY =
                        Math.max(
                            0,
                            Math.min(newY, maxY)
                        );

                    windowElement.style.left = newX + "px";
                    windowElement.style.top = newY + "px";

                }
            );

            document.addEventListener(
                "mouseup",
                function () {
                    isDragging = false;
                }
            );

        }

        /* ========================================================= */
        /* ESC CLOSES ALL OPEN LOAN WINDOWS                          */
        /* ========================================================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Escape") {

                    document
                        .querySelectorAll(".loan-window")
                        .forEach(windowElement => {
                            windowElement.remove();
                        });

                }

            }

        );

    </script>

</body>

</html>
