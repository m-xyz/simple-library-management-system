<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Simple Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background: #ffffff;
            color: #000000;
            font-family: "Courier New", monospace;
            font-size: 14px;

            background-image:
                radial-gradient(#000 0.6px, transparent 0.6px);

            background-size: 4px 4px;
        }

        /* MAIN WINDOW */

        .window {
            width: 94%;
            max-width: 1200px;
            margin: 35px auto;

            background: #ffffff;

            border: 3px solid #000;

            box-shadow:
                6px 6px 0 #000;
        }

        /* MAC WINDOW TITLE BAR */

        .title-bar {
            height: 34px;

            display: flex;
            align-items: center;

            border-bottom: 3px solid #000;

            background: #fff;

            padding: 0 8px;

            position: relative;
        }

        .title {
            position: absolute;

            left: 50%;
            transform: translateX(-50%);

            background: #fff;

            padding: 0 12px;

            font-weight: bold;

            letter-spacing: 1px;
        }

        /* LOGOUT BUTTON */

        .logout-form {
            margin: 0;
            padding: 0;
            z-index: 2;
        }

        .logout-button {
            width: 18px;
            height: 18px;

            padding: 0;

            background: #fff;
            color: #000;

            border: 2px solid #000;

            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;

            line-height: 12px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-button:hover {
            background: #000;
            color: #fff;
        }

        .logout-button:active {
            background: #000;
            color: #fff;
        }

        /* CONTENT */

        .content {
            padding: 25px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 22px;
            margin: 0 0 8px 0;

            text-transform: uppercase;
        }

        .welcome h1 span {
            background: #000;
            color: #fff;
            padding: 2px 6px;
        }

        .welcome h1 .username {
            text-transform: none;
        }

        /* DATE / TIME */

        .datetime {
            display: flex;
            justify-content: flex-start;
            gap: 20px;

            font-size: 13px;
            font-weight: bold;
        }

        .datetime span {
            background: #000;
            color: #fff;
            padding: 2px 6px;
        }

        /* BUTTONS */

        .toolbar {
            display: flex;
            gap: 12px;

            margin-bottom: 28px;
        }

        .mac-button {
            display: inline-block;

            min-width: 150px;

            padding: 8px 14px;

            color: #000;
            background: #fff;

            border: 1px solid #000;

            text-decoration: none;

            font-family: "Courier New", monospace;
            font-weight: bold;

            text-align: center;

            box-shadow:
                3px 3px 0 #000;
        }

        .mac-button:hover {
            background: #000;
            color: #fff;
        }

        .mac-button:active {
            transform: translate(2px, 2px);

            box-shadow:
                1px 1px 0 #000;
        }

        /* SECTION TITLE */

        .section-title {
            font-weight: bold;

            margin-bottom: 8px;

            padding: 5px 8px;

            border: 2px solid #000;

            background: #000;
            color: #fff;

            letter-spacing: 1px;
        }

        /* TABLE */

        .table-wrapper {
            border: 2px solid #000;

            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            background: #fff;
        }

        th {
            background: #fff;

            border-bottom: 3px double #000;

            padding: 10px;

            text-align: left;

            font-weight: bold;

            text-transform: uppercase;
        }

        td {
            padding: 10px;

            border-bottom: 1px solid #000;
        }

        tbody tr:nth-child(even) {
            background: repeating-linear-gradient(45deg,
                    #fff,
                    #fff 2px,
                    #000 2px,
                    #000 3px);

            background-size: 5px 5px;
        }

        tbody tr:nth-child(even) td {
            background: rgba(255, 255, 255, 0.88);
        }

        tbody tr:hover td {
            background: #000;
            color: #fff;
        }

        .isbn {
            font-family: "Courier New", monospace;
            font-weight: bold;
        }

        .quantity {
            text-align: center;
            font-weight: bold;
        }

        /* CLICKABLE ON-LOAN NUMBER */

        .loan-count {
            border: 0;
            background: transparent;

            color: inherit;

            font-family: "Courier New", monospace;
            font-size: 14px;
            font-weight: bold;

            text-decoration: underline;

            cursor: pointer;
            padding: 2px 5px;
        }

        .loan-count:hover {
            background: #000;
            color: #fff;
        }

        /* ACTION BUTTONS */

        .actions {
            white-space: nowrap;
        }

        .small-button {
            display: inline-block;

            padding: 5px 8px;

            margin-right: 5px;

            border: 2px solid #000;

            color: #000;
            background: #fff;

            text-decoration: none;

            font-family: "Courier New", monospace;
            font-weight: bold;
        }

        .small-button:hover {
            background: #000;
            color: #fff;
        }

        /* STATUS BAR */

        .status-bar {
            display: flex;
            justify-content: space-between;

            margin-top: 25px;

            border-top: 3px double #000;

            padding-top: 8px;

            font-size: 12px;
        }

        .resize-handle {
            width: 15px;
            height: 15px;

            border-left: 2px solid #000;
            border-top: 2px solid #000;

            margin-left: auto;
        }


        /* ================================================= */
        /* LOAN INFORMATION WINDOW                           */
        /* ================================================= */

        .loan-window {
            position: fixed;

            width: 650px;
            max-width: 90vw;

            background: #fff;
            color: #000;

            border: 3px solid #000;

            box-shadow: 7px 7px 0 #000;

            z-index: 1000;
        }

        .loan-title-bar {
            height: 34px;

            display: flex;
            align-items: center;

            position: relative;

            border-bottom: 3px solid #000;

            background: #fff;

            cursor: move;

            user-select: none;
        }

        .loan-close {
            width: 18px;
            height: 18px;

            margin-left: 7px;

            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid #000;

            background: #fff;

            color: #000;

            font-family: Arial, sans-serif;

            font-size: 15px;

            font-weight: bold;

            line-height: 12px;

            cursor: pointer;
        }

        .loan-close:hover {
            background: #000;
            color: #fff;
        }

        .loan-title {
            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            padding: 0 12px;

            background: #fff;

            font-weight: bold;

            letter-spacing: 1px;

            white-space: nowrap;
        }

        .loan-content {
            padding: 20px;
        }

        .loan-heading {
            display: flex;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 20px;

            padding-bottom: 12px;

            border-bottom: 3px double #000;

            font-weight: bold;
        }

        .loan-heading span {
            background: #000;

            color: #fff;

            padding: 2px 5px;
        }

        .loan-section-title {
            margin-bottom: 8px;

            padding: 5px 8px;

            background: #000;

            color: #fff;

            font-weight: bold;

            letter-spacing: 1px;
        }

        .loan-table-wrapper {
            border: 2px solid #000;

            overflow-x: auto;
        }

        .loan-table {
            width: 100%;

            border-collapse: collapse;

            background: #fff;
        }

        .loan-table th {
            padding: 9px;

            text-align: left;

            border-bottom: 3px double #000;

            font-weight: bold;
        }

        .loan-table td {
            padding: 9px;

            border-bottom: 1px solid #000;
        }

        .loan-table tbody tr:nth-child(even) {
            background:
                repeating-linear-gradient(45deg,
                    #fff,
                    #fff 2px,
                    #000 2px,
                    #000 3px);

            background-size: 5px 5px;
        }

        .loan-table tbody tr:nth-child(even) td {
            background: rgba(255, 255, 255, 0.88);
        }

        .loan-table tbody tr:hover td {
            background: #000;
            color: #fff;
        }

        .loan-status {
            display: flex;

            align-items: center;

            margin-top: 15px;

            padding-top: 8px;

            border-top: 1px solid #000;

            font-size: 11px;

            font-weight: bold;
        }

        .status-indicator {
            display: inline-block;

            width: 9px;
            height: 9px;

            margin-right: 5px;

            border: 2px solid #000;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .content {
                padding: 15px;
            }

            .toolbar {
                flex-direction: column;
            }

            .mac-button {
                width: 100%;
            }

            .window {
                width: 96%;
                margin: 15px auto;
            }

            .loan-window {
                width: 94vw;

                top: 100px;
            }

            .loan-heading {
                flex-direction: column;

                gap: 8px;
            }
        }

        .success-message {
            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 25px;

            padding: 12px 14px;

            background: #fff;

            border: 1px solid #000;

            box-shadow:
                4px 4px 0 #000;

            font-weight: bold;
        }

        .success-icon {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 24px;
            height: 24px;

            flex-shrink: 0;

            background: #00ff00;

            border: 1px solid #000;

            color: #000000;

            font-family: "Courier New", monospace;
            font-size: 15px;
            font-weight: bold;
        }

        .success-text {
            line-height: 1.4;
        }
    </style>

</head>

<body>

    <!-- ================================================= -->

    <!-- MAIN MACINTOSH WINDOW                             -->

    <!-- ================================================= -->

    <div class="window">


        <!-- Macintosh title bar -->

        <div class="title-bar">

            <!-- Logout / close button -->

            <form th:action="@{/logout}" method="post" class="logout-form">

                <button type="submit" class="logout-button" title="Log Out">
                    ×
                </button>

            </form>


            <div class="title">
                Simple Library Management System
            </div>

        </div>


        <div class="content">

            <div class="success-message" th:if="${addBookSuccessMessage}">
                <div class="success-icon"> ✓ </div>
                <div class="success-text" th:text="${addBookSuccessMessage}"> Book successfully added. </div>
            </div>


            <!-- ================================================= -->
            <!-- HEADER                                            -->
            <!-- ================================================= -->

            <div class="welcome">

                <h1>

                    Logged in as

                    <span class="username" th:text="${username}">
                        USERNAME
                    </span>

                </h1>


                <div class="datetime">

                    <div>
                        <span id="current-date"></span>
                    </div>

                    <div>
                        <span id="current-time"></span>
                    </div>

                </div>

            </div>


            <!-- ================================================= -->
            <!-- MAIN BUTTONS                                      -->
            <!-- ================================================= -->

            <div class="toolbar">

                <a th:href="@{/owner/add-book}" class="mac-button">
                    [+] BOOK
                </a>


                <a th:href="@{/owner/loan-history}" class="mac-button">
                    LOAN HISTORY
                </a>

            </div>


            <!-- ================================================= -->
            <!-- INVENTORY                                         -->
            <!-- ================================================= -->

            <div class="section-title">
                BOOK INVENTORY
            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th></th>
                            <th>ISBN</th>
                            <th>TITLE</th>
                            <th>AUTHOR</th>
                            <th>STOCK</th>
                            <th>ON LOAN</th>
                        </tr>

                    </thead>

                    <tbody>
                        <tr th:each="book : ${books}">
                            <td>
                                <a>[E]</a>
                                <a>[D]</a>
                            </td>
                            <td th:text="${book.isbn}">ISBN</td>
                            <td th:text="${book.title}">Title</td>
                            <td th:text="${book.author.name}">Author</td>
                            <td th:text="${book.stock}">Stock</td>
                            <td>666</td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- ===================================================== -->

    <!-- DRAGGABLE LOAN INFORMATION WINDOW                    -->

    <!-- ===================================================== -->
    <template id="loan-window-template">


        <div class="loan-window">

            <div class="loan-title-bar">

                <button type="button" class="loan-close">
                    ×
                </button>

                <div class="loan-title">
                    LOAN INFORMATION
                </div>

            </div>


            <div class="loan-content">

                <div class="loan-heading">

                    <div>
                        ISBN:
                        <span class="loan-isbn"></span>
                    </div>

                    <div>
                        BOOK:
                        <span class="loan-book-title"></span>
                    </div>

                </div>


                <div class="loan-section-title">
                    CURRENTLY ON LOAN
                </div>


                <div class="loan-table-wrapper">

                    <table class="loan-table">

                        <thead>

                            <tr>
                                <th>USERNAME</th>
                                <th>BORROWED</th>
                                <th>DUE DATE</th>
                            </tr>

                        </thead>

                        <tbody class="loan-users"></tbody>

                    </table>

                </div>


                <div class="loan-status">

                    <span class="status-indicator"></span>

                    <span class="loan-count-text">
                        0 USERS CURRENTLY BORROWING
                    </span>

                </div>

            </div>

        </div>

    </template>

    <script>


        /* ========================================================= */
        /* DATE AND TIME                                             */
        /* ========================================================= */

        function updateDateTime() {

            const now = new Date();


            const date =
                now.toLocaleDateString("en-GB", {

                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"

                });


            const time =
                now.toLocaleTimeString("en-GB", {

                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"

                });


            document.getElementById("current-date")
                .textContent = date;


            document.getElementById("current-time")
                .textContent = time;

        }


        updateDateTime();

        setInterval(updateDateTime, 1000);


        /* ========================================================= */
        /* MOCK LOAN DATA                                           */
        /* ========================================================= */

        /* ========================================================= */
        /* MULTIPLE DRAGGABLE LOAN WINDOWS                           */
        /* ========================================================= */

        let nextWindowOffset = 0;

        /*
        
        * Mock loan data
          */

        const loanData = {


            "9780000001": {

                title: "The Hobbit",

                users: [
                    {
                        username: "weird",
                        borrowed: "01/08/2026",
                        dueDate: "15/08/2026"
                    },
                    {
                        username: "john_smith",
                        borrowed: "03/08/2026",
                        dueDate: "17/08/2026"
                    }
                ]

            },


            "9780000002": {

                title: "Dune",

                users: [
                    {
                        username: "alice",
                        borrowed: "05/08/2026",
                        dueDate: "19/08/2026"
                    }
                ]

            },


            "9780000003": {

                title: "1984",

                users: []

            },


            "9780000004": {

                title: "Clean Code",

                users: [
                    {
                        username: "developer01",
                        borrowed: "02/08/2026",
                        dueDate: "16/08/2026"
                    },
                    {
                        username: "bob",
                        borrowed: "04/08/2026",
                        dueDate: "18/08/2026"
                    },
                    {
                        username: "alice",
                        borrowed: "06/08/2026",
                        dueDate: "20/08/2026"
                    }
                ]

            }


        };

        /* ========================================================= */
        /* OPEN A NEW LOAN WINDOW                                   */
        /* ========================================================= */

        function openLoanWindow(isbn) {


            const book = loanData[isbn];

            if (!book) {
                return;
            }


            /*
             * Get the template
             */

            const template =
                document.getElementById("loan-window-template");


            /*
             * Clone the template
             */

            const windowElement =
                template.content
                    .firstElementChild
                    .cloneNode(true);


            /*
             * Add it to the page
             */

            document.body.appendChild(windowElement);


            /*
             * Populate book information
             */

            windowElement
                .querySelector(".loan-isbn")
                .textContent = isbn;


            windowElement
                .querySelector(".loan-book-title")
                .textContent = book.title;


            /*
             * Populate users
             */

            const tableBody =
                windowElement.querySelector(".loan-users");


            if (book.users.length === 0) {

                const row =
                    document.createElement("tr");


                row.innerHTML = `
        <td colspan="3">
            NO USERS CURRENTLY
            BORROWING THIS BOOK.
        </td>
    `;


                tableBody.appendChild(row);

            } else {

                book.users.forEach(user => {

                    const row =
                        document.createElement("tr");


                    row.innerHTML = `
            <td>${user.username}</td>
            <td>${user.borrowed}</td>
            <td>${user.dueDate}</td>
        `;


                    tableBody.appendChild(row);

                });

            }


            /*
             * Update loan count
             */

            windowElement
                .querySelector(".loan-count-text")
                .textContent =

                book.users.length +
                " USER" +
                (book.users.length === 1 ? "" : "S") +
                " CURRENTLY BORROWING";


            /*
             * Give each new window a slightly
             * different starting position.
             */

            const offset =
                nextWindowOffset % 5;


            windowElement.style.left =
                (180 + offset * 35) + "px";


            windowElement.style.top =
                (120 + offset * 35) + "px";


            /*
             * Latest windows opened goes to the front
             */

            bringToFront(windowElement);


            /*
             * Close button
             */

            const closeButton =
                windowElement.querySelector(".loan-close");


            closeButton.addEventListener(
                "click",
                function () {

                    windowElement.remove();

                }
            );


            /*
             * Make this particular window draggable.
             */

            makeDraggable(
                windowElement,
                windowElement.querySelector(".loan-title-bar")
            );


            /*
             * Bring this window to the front
             * when clicked.
             */

            windowElement.addEventListener(
                "mousedown",
                function () {

                    bringToFront(windowElement);

                }
            );


        }

        /* ========================================================= */
        /* BRING WINDOW TO FRONT                                    */
        /* ========================================================= */

        let highestZIndex = 1000;

        function bringToFront(windowElement) {


            highestZIndex++;

            windowElement.style.zIndex =
                highestZIndex;


        }

        /* ========================================================= */
        /* MAKE WINDOW DRAGGABLE                                    */
        /* ========================================================= */

        function makeDraggable(windowElement, titleBar) {


            let isDragging = false;

            let offsetX = 0;

            let offsetY = 0;


            /*
             * Start dragging
             */

            titleBar.addEventListener(
                "mousedown",
                function (event) {

                    /*
                     * Don't start dragging when
                     * clicking the close button.
                     */

                    if (
                        event.target.closest(".loan-close")
                    ) {
                        return;
                    }


                    bringToFront(windowElement);


                    isDragging = true;


                    const rect =
                        windowElement.getBoundingClientRect();


                    offsetX =
                        event.clientX - rect.left;


                    offsetY =
                        event.clientY - rect.top;

                }
            );


            /*
             * Move window
             */

            document.addEventListener(
                "mousemove",
                function (event) {

                    if (!isDragging) {
                        return;
                    }


                    let newX =
                        event.clientX - offsetX;


                    let newY =
                        event.clientY - offsetY;


                    /*
                     * Keep the window inside
                     * the browser viewport.
                     */

                    const maxX =
                        window.innerWidth -
                        windowElement.offsetWidth;


                    const maxY =
                        window.innerHeight -
                        windowElement.offsetHeight;


                    newX =
                        Math.max(
                            0,
                            Math.min(newX, maxX)
                        );


                    newY =
                        Math.max(
                            0,
                            Math.min(newY, maxY)
                        );


                    windowElement.style.left =
                        newX + "px";


                    windowElement.style.top =
                        newY + "px";

                }
            );


            /*
             * Stop dragging
             */

            document.addEventListener(
                "mouseup",
                function () {

                    isDragging = false;

                }
            );


        }

        /* ========================================================= */
        /* ESC CLOSES ALL OPEN LOAN WINDOWS                         */
        /* ========================================================= */

        document.addEventListener(
            "keydown",
            function (event) {


                if (event.key === "Escape") {

                    document
                        .querySelectorAll(".loan-window")
                        .forEach(windowElement => {

                            windowElement.remove();

                        });

                }

            }


        );


    </script>

</body>

</html>
