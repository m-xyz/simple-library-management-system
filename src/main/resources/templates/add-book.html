<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Library - Add book</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background: #ffffff;
            color: #000000;

            font-family: "Courier New", monospace;
            font-size: 14px;

            background-image:
                radial-gradient(#000 0.6px, transparent 0.6px);

            background-size: 4px 4px;
        }

        .window {
            width: 650px;
            max-width: 94%;

            margin: 70px auto;

            background: #ffffff;

            border: 3px solid #000;

            box-shadow:
                6px 6px 0 #000;
        }

        .title-bar {
            height: 34px;

            display: flex;
            align-items: center;

            position: relative;

            border-bottom: 3px solid #000;

            background: #fff;

            padding: 0 8px;
        }

        .close-button {
            width: 18px;
            height: 18px;

            padding: 0;

            background: #fff;

            border: 2px solid #000;

            color: #000;

            font-family: Arial, sans-serif;

            font-size: 15px;
            font-weight: bold;

            line-height: 12px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;
        }

        .close-button:hover {
            background: #000;
            color: #fff;
        }

        .title {
            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            background: #fff;

            padding: 0 12px;

            font-weight: bold;

            letter-spacing: 1px;

            white-space: nowrap;
        }

        .content {
            padding: 28px;
        }

        .heading {
            margin-bottom: 25px;

            padding-bottom: 12px;

            border-bottom: 3px double #000;
        }

        .heading h1 {
            margin: 0 0 8px 0;

            font-size: 22px;

            text-transform: uppercase;
        }

        .heading p {
            margin: 0;

            font-size: 13px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 6px;

            font-weight: bold;

            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;

            padding: 9px 10px;

            background: #fff;

            color: #000;

            border: 2px solid #000;

            outline: none;

            font-family: "Courier New", monospace;

            font-size: 14px;
        }

        .form-group input:focus {
            background: #000;

            color: #fff;
        }

        .help-text {
            margin-top: 5px;

            font-size: 11px;

            color: #000;
        }

        .error {
            margin-top: 5px;

            color: #ff0000;

            font-weight: bold;

            font-size: 12px;
        }

        .button-bar {
            display: flex;

            justify-content: flex-end;

            gap: 12px;

            margin-top: 30px;

            padding-top: 15px;

            border-top: 3px double #000;
        }

        .mac-button {
            min-width: 130px;

            padding: 9px 15px;

            border: 1px solid #000;

            background: #fff;

            color: #000;

            text-decoration: none;

            font-family: "Courier New", monospace;

            font-weight: bold;

            text-align: center;

            cursor: pointer;

            box-shadow:
                3px 3px 0 #000;
        }

        .mac-button:hover {
            background: #000;

            color: #fff;
        }

        .mac-button:active {
            transform: translate(2px, 2px);

            box-shadow:
                1px 1px 0 #000;
        }

        .add-button {
            background: #000;

            color: #fff;
        }

        .add-button:hover {
            background: #fff;

            color: #000;
        }

        .status-bar {
            display: flex;

            justify-content: space-between;

            margin-top: 25px;

            padding-top: 8px;

            border-top: 3px double #000;

            font-size: 11px;
        }

        .status-indicator {
            display: inline-block;

            width: 9px;
            height: 9px;

            margin-right: 5px;

            border: 2px solid #000;

            vertical-align: middle;
        }

        .resize-handle {
            width: 15px;
            height: 15px;

            border-left: 2px solid #000;

            border-top: 2px solid #000;

            margin-left: auto;
        }

        .window-icon {
            width: 16px;
            height: 16px;

            border: 2px solid #000;

            margin-right: 10px;

            background:
                linear-gradient(to bottom,
                    #000 0px,
                    #000 2px,
                    #fff 2px,
                    #fff 4px);

            background-size: 100% 4px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .window {
                margin: 25px auto;
            }

            .content {
                padding: 18px;
            }

            .button-bar {
                flex-direction: column;
            }

            .mac-button {
                width: 100%;
            }

        }
    </style>

</head>

<body>

    <div class="window">

        <div class="title-bar">

            <div class="window-icon"></div>

            <div class="title">
                ADD BOOK
            </div>

        </div>

        <div class="content">

            <div class="heading">

                <h1>
                    Book info
                </h1>

            </div>

            <!-- ================================================= -->
            <!-- ADD BOOK FORM                                     -->
            <!-- ================================================= -->

            <form th:action="@{/owner/add-book}" th:object="${bookRequest}" method="post">

                <div class="form-group">

                    <label for="isbn">
                        ISBN
                    </label>

                    <input type="text" id="isbn" th:field="*{isbn}" placeholder="9780000000" required>

                    <div class="error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}">

                    </div>

                </div>

                <div class="form-group">

                    <label for="title">
                        Title
                    </label>

                    <input type="text" id="title" th:field="*{title}" placeholder="Book title" required>

                    <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">

                    </div>

                </div>

                <div class="form-group">

                    <label for="author">
                        Author
                    </label>

                    <input type="text" id="author" th:field="*{authorName}" placeholder="Author name" required>

                    <div class="error" th:if="${#fields.hasErrors('authorName')}" th:errors="*{authorName}">

                    </div>

                </div>

                <div class="form-group">

                    <label for="stock">
                        Stock
                    </label>

                    <input type="number" id="stock" th:field="*{stock}" min="1" value="1" required>

                    <div class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}">
                    </div>

                </div>

                <div class="button-bar">

                    <a th:href="@{/owner}" class="mac-button">
                        CANCEL
                    </a>

                    <button type="submit" class="mac-button add-button">
                        ADD BOOK
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
